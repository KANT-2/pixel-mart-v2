# Render 블루프린트 — 백엔드(FastAPI) + PostgreSQL, 무료 요금제
services:
  - type: web
    name: pixel-mart-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pixel-mart-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

databases:
  - name: pixel-mart-db
    plan: free
    region: singapore
    databaseName: pixelmart
    user: pixelmart
